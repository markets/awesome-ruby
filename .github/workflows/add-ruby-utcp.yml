name: Add ruby-utcp

on:
  push:
    branches:
      - add-ruby-utcp

permissions:
  contents: write

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-ruby-utcp

      - name: Add ruby-utcp to AI and LLMs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()
          needle = "* [ruby-openai](https://github.com/alexrudall/ruby-openai) - OpenAI API + Ruby!\n"
          addition = "* [ruby-utcp](https://github.com/universal-tool-calling-protocol/ruby-utcp) - A Ruby implementation of the Universal Tool Calling Protocol (UTCP) for discovering, searching, and calling tools over their native protocols.\n"

          if addition in text:
              raise SystemExit("ruby-utcp is already present")
          if needle not in text:
              raise SystemExit("expected insertion point not found")

          path.write_text(text.replace(needle, needle + addition, 1))
          PY

          rm .github/workflows/add-ruby-utcp.yml

      - name: Commit README change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/add-ruby-utcp.yml
          git commit -m "Add ruby-utcp to AI and LLMs"
          git push origin add-ruby-utcp
